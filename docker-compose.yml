services:
  tjsocks:
    # Image published by the GitHub Actions workflow to the GitHub Container
    # Registry. No login is needed to pull a public package.
    image: ghcr.io/sitdownkevin/tjsocks:latest
    container_name: tjsocks
    restart: unless-stopped

    # ---------------------------------------------------------------------
    # 配置：直接改这里，不需要 .env
    # ---------------------------------------------------------------------
    environment:
      # --- 校园 VPN 凭证（必填）---
      TJ_USER: "你的学号"
      TJ_PASSWORD: "你的密码"

      # --- VPN 网关（一般不用改）---
      TJ_GATEWAY: "vpn.tongji.cn"
      TJ_AUTH_METHOD: "LDAP3"
      # 服务器 DNS 解析不了 vpn.tongji.cn 时，取消注释并填写网关 IP
      # TJ_GATEWAY_ADDRESS: "202.120.189.34:443"

      # --- SOCKS5 代理认证（公网部署必填）---
      SOCKS_USER: "proxyuser"
      SOCKS_PASS: "换一个强密码"

      # --- 监听地址（容器内，一般不用改）---
      SOCKS_LISTEN: "0.0.0.0:1080"
      SOCKS_UDP_LISTEN: "0.0.0.0:1080"
      # 返回给客户端的 UDP 中继地址。留空表示 0.0.0.0:1080，Clash / mihomo /
      # sing-box / v2rayN 会自动替换成代理服务器地址。若客户端不认 0.0.0.0，
      # 取消注释并填公网地址。
      # SOCKS_UDP_ADVERTISE: "203.0.113.10:1080"

      # --- 日志级别：debug / info / warn / error ---
      TJ_LOG_LEVEL: "info"

    # TCP 提供 CONNECT，UDP 提供 UDP ASSOCIATE，两者都要映射。
    # 左侧是宿主机端口，想改端口只改左边（例如 7891:1080/tcp）。
    ports:
      - "1080:1080/tcp"
      - "1080:1080/udp"

    # 隧道只占用一条 TLS 连接，128 MB 绰绰有余。
    deploy:
      resources:
        limits:
          memory: 128M

    # 容器加固：不需要写入磁盘，也不需要任何 capability。
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "/usr/local/bin/tjsocks", "-healthcheck", "127.0.0.1:1080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
